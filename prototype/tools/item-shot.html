<!doctype html><meta charset="utf-8"><title>item shot</title>
<style>html,body{margin:0;background:#1b2428}canvas{display:block}</style>
<script type="module">
// Renders floor items in a row: /tools/item-shot.html?items=[{"name":"ruby potion","class":8,"appearance":"ruby"},...]
import * as THREE from 'three';
import {createGroundModel} from '../ground-models.js';
const items=JSON.parse(new URLSearchParams(location.search).get('items')||'[]');
const W=Math.min(1600,Math.max(500,items.length*190)),H=420;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setClearColor(0x1b2428);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(30,W/H,.05,60);
scene.add(new THREE.HemisphereLight(0x92bfc4,0x333025,1.1));const key=new THREE.DirectionalLight(0xffd8a0,2.2);key.position.set(-1,3,2);scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,3),new THREE.MeshStandardMaterial({color:0x3a4640,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const gap=.55;items.forEach((it,i)=>{const m=createGroundModel(it);if(!m)return;m.position.x=(i-(items.length-1)/2)*gap;scene.add(m);});
const span=items.length*gap;camera.position.set(0,span*.22+.45,Math.max(1.6,span*.55));camera.lookAt(0,.1,0);
renderer.render(scene,camera);window.__done=true;
</script>
