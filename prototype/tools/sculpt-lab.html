<!doctype html><meta charset="utf-8"><title>Sculpt lab</title>
<style>html,body{margin:0;background:#1d2529}canvas{display:block}</style>
<script type="module">
// Sculpt lab: the pet cat as grown from its parts (left) beside the sculpted anatomy
// (feline-sculpt.js, right), from the side, three-quarters and the front, in one pose.
// Views: side, three, front, back, top, and close on the head: face, face3, faceside.
// /tools/sculpt-lab.html?name=kitten&clip=idle&at=0&views=side,face3
import * as THREE from 'three';
import {createSkinnedFeline} from '../feline-skin.js';
import {LOOKS} from '../feline.js';
const q = new URLSearchParams(location.search), name = q.get('name') || 'kitten', clip = q.get('clip') || 'idle', at = +(q.get('at') || 0);
const VIEWS = (q.get('views') || 'side,three,front').split(','), W = 1200, H = 360 * VIEWS.length;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; document.body.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1d2529);
scene.add(new THREE.HemisphereLight(0xb8cfd6, 0x3a3428, 1.3));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.8); sun.position.set(-2.5, 4, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -3, right: 3, top: 2, bottom: -2}); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 8), new THREE.MeshStandardMaterial({color: 0x56604f, roughness: 1})); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const t0 = performance.now();
const cats = [createSkinnedFeline(name), createSkinnedFeline(name, undefined, {sculpt: true})];
window.__ms = performance.now() - t0;
cats.forEach((cat, i) => { cat.g.position.x = (i - .5) * 1.4; cat.g.traverse(o => { if (o.isMesh) o.castShadow = true; }); scene.add(cat.g); cat.animator.show(clip, at); });
const s = LOOKS[name].scale || 1, camera = new THREE.PerspectiveCamera(22, (W / 2) / 360, .05, 50);
renderer.setScissorTest(true);
VIEWS.forEach((view, row) => cats.forEach((cat, i) => {
  const turn = {side: Math.PI / 2, faceside: Math.PI / 2, front: 0, face: 0, back: Math.PI, top: Math.PI / 2}[view];
  cat.g.rotation.y = turn ?? Math.PI / 4; cat.g.updateMatrixWorld(true);
  const x = cat.g.position.x;
  if (view === 'top') { camera.position.set(x, 2.6 * s, .01); camera.lookAt(x, 0, 0); }
  else if (view.startsWith('face')) { const h = cat.head.getWorldPosition(new THREE.Vector3()); camera.position.set(h.x, h.y + .03 * s, h.z + .75 * s); camera.lookAt(h.x, h.y, h.z); }
  else { camera.position.set(x, .33 * s + .1, 2.1 * s + .35); camera.lookAt(x, .27 * s, 0); }
  const y = H - (row + 1) * 360; renderer.setViewport(i * W / 2, y, W / 2, 360); renderer.setScissor(i * W / 2, y, W / 2, 360); renderer.render(scene, camera);
}));
window.__done = true;
</script>
