<!doctype html><meta charset="utf-8"><title>creature shot</title>
<style>html,body{margin:0;background:#233138}canvas{display:block}</style>
<script type="module">
// Renders one creature at a 3/4 view and at the game camera: /tools/creature-shot.html?name=chromatic%20dragon&view=game
// (optional &bend=tail2.y:.6,... turns named joints first; &pose=sleep lays a dragon down asleep; &idle=20 lets it stand idle 20 s in the game's own update; &walk=2 walks it 2 s)
import * as THREE from 'three';
import {createCreature} from '../creatures.js';
import {sleepPose, dragonPoser} from '../dragon-rest.js';
import {WING_POSES} from '../dragon-wing-poses.js';
import {restPose, birdPoser} from '../cockatrice-rest.js';
import {restPose as beeRest, rests as beeRests} from '../bee-rest.js';
import {updateDragonMenace} from '../dragon-menace.js';
const q=new URLSearchParams(location.search),name=q.get('name')||'chromatic dragon',view=q.get('view')||'three';
const W=900,H=700,renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setClearColor(0x233138);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,W/H,.05,60);
scene.add(new THREE.HemisphereLight(0x92bfc4,0x333025,1.5));const key=new THREE.DirectionalLight(0xffe1b6,3);key.position.set(-3,5,4);scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(8,8),new THREE.MeshStandardMaterial({color:0x4a5550,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const c=createCreature({name,symbol:q.get('letter')?q.get('letter').charCodeAt(0):68,color:q.get('color')?+q.get('color'):5});scene.add(c.g);
// ?bend=tail2.y:.6,neck1.x:-.4 turns named joints (a creature's actor.joints) before the shot
// ?pose=sleep lays a dragon down asleep (dragon-rest.js)
if(q.get('pose')==='sleep'&&c.joints){const r=sleepPose(c,name);r.apply(r.pose);}
// ?pose=rest lies a chickatrice, cockatrice or pyrolisk down on its breast (cockatrice-rest.js)
if(q.get('pose')==='rest'&&c.quirk==='cockatrice'){const r=restPose(c);birdPoser(c).apply(r.pose);}
// ?pose=rest also lands a bee, its head hung and wings folded (bee-rest.js)
if(q.get('pose')==='rest'&&beeRests(c)){const r=beeRest(c);birdPoser(c).apply(r.pose);}
// ?pose=mantle holds a dragon's mantle (dragon-menace.js) mid-hold
if(q.get('pose')==='mantle'){c.species=name;updateDragonMenace(c,1/30,0,false,false,null);c.menace.cur={kind:'mantle',s:.8,side:1};c.menace.f=1;for(let i=0;i<3;i++)updateDragonMenace(c,1/30,i/30,false,false,null);}
// ?idle=20 runs the game's own per-frame dragon update (dragon-menace.js) that many seconds with nobody near
if(q.get('idle')){c.species=name;for(let i=0;i<+q.get('idle')*30;i++)updateDragonMenace(c,1/30,i/30,false,false,null);}
// ?pose=fold, flapup or flapdown holds a dragon's baked folded wings or the top or bottom of its wingbeat (dragon-wings.js)
if(['fold','flapup','flapdown'].includes(q.get('pose'))&&c.joints){const e=WING_POSES[name],k=q.get('pose')==='fold'?'fold':q.get('pose').slice(4),p=JSON.parse(JSON.stringify(e[k]));for(const w of c.wings)p[w.name]={...(p[w.name]||{}),y:(p[w.name]?.y||0)+(w.userData.side||1)*-.18};dragonPoser(c).apply(p);}
// ?walk=2 walks it that many seconds in the game's own update, after live.js's leg swing and body bob each frame
if(q.get('walk')){c.species=name;for(let i=0;i<+q.get('walk')*30;i++){const t=i/30;c.legs?.forEach((l,k)=>l.rotation.x=Math.sin(t*22+k*2)*.4);if(c.body)c.body.position.y=Math.sin(t*22)*.035;updateDragonMenace(c,1/30,t,true,true,null);}}
for(const b of (q.get('bend')||'').split(',').filter(Boolean)){const [k,v]=b.split(':'),[n,ax]=k.split('.');if(c.joints?.[n])c.joints[n].rotation[ax]+=+v;}
const box=new THREE.Box3().setFromObject(c.g),size=box.getSize(new THREE.Vector3()),r=Math.max(size.x,size.y,size.z);
const d=r*(view==='game'?3.4:2.4),look=new THREE.Vector3(0,size.y*.4,0);
if(view==='game')camera.position.set(.3,d*1.1,d*.55);else if(view==='side')camera.position.set(d,size.y*.5,0);else if(view==='head')camera.position.set(r*.6,size.y*.8,r*1.0);else camera.position.set(d*.8,size.y*.9+r*.3,d*.8);
camera.lookAt(view==='head'?new THREE.Vector3(0,size.y*.6,r*.3):look);
renderer.render(scene,camera);window.__done=true;
</script>
