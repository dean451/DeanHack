<!doctype html><meta charset="utf-8"><title>batch cull probe</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="module">
// Renders one batched monster after it has walked far from where the batch first drew it:
// /tools/batch-cull-probe.html?name=leprechaun[&cull=1]. It must be fully drawn, not just its eyes.
import * as THREE from 'three';
import {createCreature,bakeDraws} from '../creatures.js';
import {createActorBatch} from '../batched-actors.js';
const q=new URLSearchParams(location.search),name=q.get('name')||'leprechaun';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(600,400);document.body.append(renderer.domElement);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1.5,.1,60);
scene.add(new THREE.HemisphereLight(0x92bfc4,0x333025,1.2));const key=new THREE.DirectionalLight(0xffd8a0,2.5);key.position.set(-1,3,2);scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x3a4640}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const root=new THREE.Group();scene.add(root);const batch=createActorBatch(root);
const a=createCreature({name,symbol:'l'.charCodeAt(0),color:2});bakeDraws(a);root.add(a.g);batch.add(a);
// ?cull=1 puts three's default whole-mesh culling back, to show the bug this probe exists for.
if(q.get('cull')==='1')root.traverse(o=>{if(o.isBatchedMesh)o.frustumCulled=true;});
// First frame: the monster stands at the origin and the batch computes its bounding sphere there.
camera.position.set(0,2,4);camera.lookAt(0,.5,0);batch.update();renderer.render(scene,camera);
// Then it walks 12 units away and the camera follows it there.
a.g.position.set(12,0,0);a.g.updateMatrixWorld(true);batch.update();
camera.position.set(12,2,4);camera.lookAt(12,.5,0);renderer.render(scene,camera);
window.__done=true;
</script>
